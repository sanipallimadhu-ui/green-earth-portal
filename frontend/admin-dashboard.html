<!DOCTYPE html>
<html>
<head>
  <title>Admin Dashboard</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: #f4f7f9;
    }

    h1 { margin-bottom: 5px; }

    .dashboard {
      padding: 40px;
    }

    .cards {
      display: flex;
      gap: 20px;
      margin-top: 20px;
      flex-wrap: wrap;
    }

    .card {
      flex: 1;
      min-width: 220px;
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 6px 16px rgba(0,0,0,0.08);
      transition: 0.3s;
    }

    .card:hover { transform: translateY(-5px); }

    .card h2 {
      margin: 0;
      font-size: 30px;
      color: #2e7d32;
    }

    .card p {
      margin-top: 8px;
      color: gray;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 25px;
      background: white;
      box-shadow: 0 6px 16px rgba(0,0,0,0.08);
      border-radius: 12px;
      overflow: hidden;
    }

    th {
      background: #2e7d32;
      color: white;
      padding: 12px;
    }

    td {
      padding: 12px;
      text-align: center;
    }

    tr:nth-child(even) {
      background: #f2f2f2;
    }

    select {
      padding: 5px;
      border-radius: 5px;
    }

    button {
      padding: 6px 12px;
      border: none;
      cursor: pointer;
      border-radius: 6px;
      font-weight: 500;
    }

    .delete-btn {
      background: #c62828;
      color: white;
    }

    .logout {
      margin-top: 30px;
      background: #333;
      color: white;
    }

    img {
      border-radius: 6px;
    }
  </style>
</head>

<body>

<div class="dashboard">

  <h1>👑 Admin Dashboard</h1>
  <p>Environmental Reports Overview</p>

  <!-- STAT CARDS -->
  <div class="cards">
    <div class="card">
      <h2 id="total">0</h2>
      <p>Total Reports</p>
    </div>

    <div class="card">
      <h2 id="pending">0</h2>
      <p>Pending</p>
    </div>

    <div class="card">
      <h2 id="verified">0</h2>
      <p>Verified</p>
    </div>

    <div class="card">
      <h2 id="waiting">0</h2>
      <p>Waiting</p>
    </div>
    <div class="card">
  <h2 id="resolved">0</h2>
  <p>Resolved</p>
</div>
  </div>

  <!-- REPORT TABLE -->
  <h3 style="margin-top:30px;">📋 All Reports</h3>

  <table>
    <thead>
      <tr>
        <th>Title</th>
        <th>Category</th>
        <th>Location</th>
        <th>Status</th>
        <th>Image</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody id="reportTable"></tbody>
  </table>

  <button class="logout" onclick="logout()">Logout</button>

</div>


<script>

// 🔐 Protect page
if(!sessionStorage.getItem("admin")){
  window.location.href="admin-login.html";
}

// Logout
function logout(){
  sessionStorage.removeItem("admin");
  window.location.href="admin-login.html";
}

// Load reports
function loadReports() {

  fetch("/api/reports")
    .then(res => res.json())
    .then(data => {

      let total = data.length;
      let pending = data.filter(r => r.status === "Pending").length;
      let verified = data.filter(r => r.status === "Verified").length;
      let waiting = data.filter(r => r.status === "Waiting").length;
      let resolved = data.filter(r => r.status === "Resolved").length;

      document.getElementById("total").innerText = total;
      document.getElementById("pending").innerText = pending;
      document.getElementById("verified").innerText = verified;
      document.getElementById("waiting").innerText = waiting;
      document.getElementById("resolved").innerText = resolved;

      const table = document.getElementById("reportTable");
      table.innerHTML = "";

      data.forEach(report => {

        table.innerHTML += `
          <tr>
            <td>${report.title}</td>
            <td>${report.category}</td>
            <td>${report.address}</td>

            <td>
              <select onchange="updateStatus('${report._id}', this.value)">
                <option value="Pending" ${report.status==="Pending"?"selected":""}>Pending</option>
                <option value="Verified" ${report.status==="Verified"?"selected":""}>Verified</option>
                <option value="Waiting" ${report.status==="Waiting"?"selected":""}>Waiting</option>
                <option value="Resolved" ${report.status==="Resolved"?"selected":""}>Resolved</option>
              </select>
            </td>

            <td>
              ${report.image
                ? `<img src="/uploads/${report.image}" width="60">`
                : "No Image"}
            </td>

            <td>
              <button class="delete-btn" onclick="deleteReport('${report._id}')">
                Delete
              </button>
            </td>
          </tr>
        `;

      });

    });
}

// Update status
function updateStatus(id, newStatus) {

  fetch("/api/reports/" + id, {
    method: "PUT",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ status: newStatus })
  })
  .then(() => loadReports());
}

// Delete report
function deleteReport(id) {

  if(!confirm("Are you sure you want to delete this report?")) return;

  fetch("/api/reports/" + id, {
    method: "DELETE"
  })
  .then(() => loadReports());
}

window.onload = loadReports;

</script>

</body>
</html>
